<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گل‌شناس فارسی</title>
<meta name="theme-color" content="#2e7d4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  :root { --green:#2e7d4f; --dark:#1b3d2b; --bg:#f4f8f2; --card:#ffffff; --text:#1d2b22; --muted:#6b7b70; --gold:#c9a227; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101a14; --card:#1a2a21; --text:#e6efe8; --muted:#9db3a4; --dark:#0a1510; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Vazirmatn', Tahoma, sans-serif; background:var(--bg); color:var(--text); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { background:linear-gradient(135deg,var(--dark),var(--green)); color:#fff; text-align:center; padding:18px 12px 22px; padding-top:calc(18px + env(safe-area-inset-top,0px)); }
  header .hero { display:flex; direction:ltr; gap:10px; justify-content:center; align-items:stretch; }
  header .faravahar { width:150px; height:auto; flex:0 1 150px; min-width:0; border-radius:12px; border:2px solid var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.35); display:block; }
  header .flower-frame { flex:0 0 auto; width:84px; height:84px; align-self:center; aspect-ratio:1/1; border-radius:12px; border:2px solid var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.35); background:linear-gradient(160deg,#fff1f5,#fff8e6); padding:4px; display:flex; }
  header h1 { margin:6px 0 4px; font-size:22px; }
  #dateLine { font-size:14px; opacity:.9; }
  nav { display:flex; gap:6px; justify-content:center; background:var(--card); padding:8px; position:sticky; top:0; z-index:5; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  nav button { flex:1; max-width:160px; border:none; background:transparent; padding:10px 6px; border-radius:10px; font-family:inherit; font-size:14px; color:var(--text); cursor:pointer; }
  nav button.active { background:var(--green); color:#fff; }
  .panel { display:none; padding:14px; max-width:900px; margin:0 auto; }
  .panel.active { display:block; }
  input[type=search], select { width:100%; padding:11px 14px; border-radius:12px; border:1px solid #cdd9cf; font-family:inherit; font-size:15px; background:var(--card); color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.06); border:1px solid transparent; }
  .card:hover { border-color:var(--green); }
  .card .emoji { font-size:34px; text-align:center; }
  .card h3 { font-size:15px; margin:8px 0 2px; text-align:center; }
  .card small { display:block; text-align:center; color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:#e3f1e8; color:var(--dark); margin-top:6px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card); width:100%; max-width:640px; max-height:88vh; overflow:auto; border-radius:20px 20px 0 0; padding:18px; }
  .modal h2 { margin:0 0 4px; color:var(--green); }
  .close { float:left; border:none; background:#eee; border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:16px; }
  .tabs2 { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
  .tabs2 button { border:1px solid var(--green); background:transparent; color:var(--green); border-radius:20px; padding:6px 12px; font-family:inherit; cursor:pointer; font-size:13px; }
  .tabs2 button.active { background:var(--green); color:#fff; }
  .pager { display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap; margin:16px 0 8px; direction:rtl; }
  .pager button { min-width:38px; border:1px solid var(--green); background:transparent; color:var(--green); border-radius:10px; padding:8px 10px; font-family:inherit; font-size:14px; cursor:pointer; }
  .pager button.active { background:var(--green); color:#fff; }
  .pager button:disabled { opacity:.35; cursor:default; }
  .sec { display:none; line-height:1.9; font-size:15px; }
  .sec.active { display:block; }
  .sec ul { padding-right:20px; margin:6px 0; }
  .scan-box { background:var(--card); border-radius:16px; padding:18px; text-align:center; }
  .scan-box img { max-width:100%; border-radius:12px; margin-top:12px; }
  .btn { background:var(--green); color:#fff; border:none; border-radius:12px; padding:12px 20px; font-family:inherit; font-size:15px; cursor:pointer; margin-top:10px; }
  .btn:disabled { opacity:.5; }
  .result { margin-top:14px; background:var(--card); border-radius:14px; padding:14px; text-align:right; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.7; }
</style>
</head>

// ---------- date (Persian calendar) ----------
function showDate(){
  const d = new Date();
  try {
    const fa = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {weekday:'long', year:'numeric', month:'long', day:'numeric'}).format(d);
    document.getElementById('dateLine').textContent = fa;
  } catch(e) {
    document.getElementById('dateLine').textContent = d.toLocaleDateString('fa-IR');
  }
}
showDate();

// ---------- gallery ----------
let currentOrigin = 'ایرانی';
let currentQuery = '';
let currentPage = 1;
const PAGE_SIZE = 18;
function renderGrid(filter = currentQuery, keepPage = false) {
  if (filter !== currentQuery && !keepPage) currentPage = 1;
  currentQuery = filter;
  const q = filter.trim().toLowerCase();
  const items = PLANTS.filter(p =>
    p.origin === currentOrigin &&
    (!q || p.fa.includes(q) || p.en.toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (currentPage > pages) currentPage = pages;
  const slice = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  document.getElementById('countLine').textContent = items.length
    ? `${items.length} گل — صفحه ${currentPage} از ${pages}` : '';
  document.getElementById('grid').innerHTML = slice.map(p => `
    <div class="card" onclick="openPlant('${p.id}')">
      <div class="emoji">${p.emoji}</div>
      <h3>${p.fa}</h3>
      <small>${p.en}</small>
      <div style="text-align:center"><span class="badge">${p.origin}</span></div>
    </div>`).join('') || '<p>چیزی پیدا نشد.</p>';
  const pager = document.getElementById('pager');
  if (pages <= 1) { pager.innerHTML = ''; return; }
  let h = `<button ${currentPage === 1 ? 'disabled' : ''} data-p="${currentPage - 1}">قبلی ›</button>`;
  for (let i = 1; i <= pages; i++) h += `<button class="${i === currentPage ? 'active' : ''}" data-p="${i}">${i}</button>`;
  h += `<button ${currentPage === pages ? 'disabled' : ''} data-p="${currentPage + 1}">‹ بعدی</button>`;
  pager.innerHTML = h;
}
document.getElementById('pager').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]');
  if (!b || b.disabled) return;
  currentPage = +b.dataset.p;
  renderGrid(currentQuery, true);
  document.getElementById('tab-list').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('search').addEventListener('input', e => renderGrid(e.target.value));
document.querySelectorAll('#originTabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#originTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentOrigin = btn.dataset.o;
    currentPage = 1;
    renderGrid(currentQuery, true);
  });
});
renderGrid();

// ---------- detail window ----------
const SECTIONS = [
  ['sun','☀️ نور'], ['water','💧 آبیاری'], ['soil','🌱 خاک'],
  ['plant','🌰 کاشت'], ['temp','🌡️ دما'], ['prune','✂️ هرس'], ['propagate','🪴 تکثیر'],
  ['pests','🐛 آفات'], ['tips','💡 نکات']
];
function openPlant(id){
  const p = PLANTS.find(x => x.id === id);
  const AV = SECTIONS.filter(s => p[s[0]]);
  const tabs = AV.map((s,i) => `<button class="${i===0?'active':''}" data-k="${s[0]}" onclick="showSec(this)">${s[1]}</button>`).join('');
  const secs = AV.map((s,i) => `<div class="sec ${i===0?'active':''}" data-sec="${s[0]}">${p[s[0]]}</div>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <div style="font-size:44px;text-align:center">${p.emoji}</div>
    <h2 style="text-align:center">${p.fa}</h2>
    <p style="text-align:center;color:var(--muted);margin:0">${p.en} · ${p.origin}</p>
    <div class="tabs2">${tabs}</div>
    ${secs}`;
  document.getElementById('modal').classList.add('open');
}
function showSec(btn){
  const modal = btn.closest('.modal');
  modal.querySelectorAll('.tabs2 button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  modal.querySelectorAll('.sec').forEach(s => s.classList.toggle('active', s.dataset.sec === btn.dataset.k));
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

// ---------- camera scan ----------
let selectedFile = null;
document.getElementById('fileInput').addEventListener('change', e => {
  selectedFile = e.target.files[0];
  if (!selectedFile) return;
  const url = URL.createObjectURL(selectedFile);
  document.getElementById('preview').innerHTML = `<img src="${url}" alt="پیش‌نمایش">`;
  document.getElementById('identifyBtn').disabled = false;
  document.getElementById('scanResult').innerHTML = '';
});

function identify(){
  let stored=''; try{ stored = localStorage.getItem('plantnetKey') || ''; }catch(e){}
  const key = (window.PLANTNET_KEY || stored || '').trim();
  const out = document.getElementById('scanResult');
  if (!key) {
    out.innerHTML = `<div class="result"><p>کلید API تنظیم نشده. گل را از لیست انتخاب کن:</p>
      <select id="manual" onchange="if(this.value)openPlant(this.value)">
        <option value="">— انتخاب گل —</option>
        ${PLANTS.map(p => `<option value="${p.id}">${p.fa} (${p.en})</option>`).join('')}
      </select></div>`;
    return;
  }
  out.innerHTML = '<p>در حال شناسایی...</p>';
  const form = new FormData();
  form.append('images', selectedFile);
  form.append('organs', 'auto');
  fetch(`https://my-api.plantnet.org/v2/identify/all?api-key=${encodeURIComponent(key)}&lang=en`, { method:'POST', body:form })
    .then(r => r.json())
    .then(data => {
      const best = data.results && data.results[0];
      if (!best) { out.innerHTML = '<p>گل شناسایی نشد. عکس واضح‌تری بگیر.</p>'; return; }
      const sci = best.species.scientificNameWithoutAuthor;
      const common = (best.species.commonNames || [])[0] || '';
      const match = PLANTS.find(p => p.en.toLowerCase() === common.toLowerCase());
      out.innerHTML = `<div class="result">
        <h3>${common || sci}</h3>
        <p style="color:var(--muted)">نام علمی: ${sci} · اطمینان: ${Math.round(best.score*100)}٪</p>
        ${match ? `<button class="btn" onclick="openPlant('${match.id}')">طرز نگهداری کامل</button>`
                : '<p class="note">طرز نگهداری این گل هنوز در برنامه نیست.</p>'}
      </div>`;
    })
    .catch(() => { out.innerHTML = '<p>خطا در اتصال. کلید یا اینترنت را بررسی کن.</p>'; });
}

function saveKey(){
  const v = document.getElementById('apiKey').value.trim();
  try { localStorage.setItem('plantnetKey', v); } catch(e) {}
  document.getElementById('keyStatus').textContent = v ? 'کلید ذخیره شد.' : 'کلید پاک شد.';
}
