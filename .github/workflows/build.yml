
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Golshenas com.golshenas.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Icon, name and camera permission
        run: |
          sudo apt-get install -y imagemagick
          cd app/android/app/src/main
          rm -rf res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            convert "$GITHUB_WORKSPACE/icon.png" -resize ${s}x${s} res/mipmap-$d/ic_launcher.png
            cp res/mipmap-$d/ic_launcher.png res/mipmap-$d/ic_launcher_round.png
          done
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">گل‌شناس فارسی</string>#' res/values/strings.xml
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">گل‌شناس فارسی</string>#' res/values/strings.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' AndroidManifest.xml
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: golshenas-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
